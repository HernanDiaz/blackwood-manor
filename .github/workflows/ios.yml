# Compila la app de iPhone en un Mac de GitHub y la sube a TestFlight.
# Se lanza a mano: GitHub → Actions → "iOS (TestFlight)" → Run workflow.
#
# Secretos necesarios (Settings → Secrets and variables → Actions), ver docs/MOVIL.md:
#   APPLE_TEAM_ID   ID de equipo de Apple Developer (10 caracteres)
#   ASC_KEY_ID      ID de la clave de API de App Store Connect
#   ASC_ISSUER_ID   ID del emisor (Issuer ID) de App Store Connect
#   ASC_KEY_P8      Contenido completo del archivo AuthKey_XXXX.p8
#
# La firma es automática: Xcode crea el certificado de distribución y el perfil con la
# clave de API, así que no hace falta un Mac propio ni tener iPhones registrados.
# Se compila sin firmar y se firma al exportar para App Store Connect.

name: iOS (TestFlight)

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name (ver docs/MOVIL.md)"
              missing=1
            fi
          done
          exit $missing

      # Apple exige compilar con el SDK de iOS más reciente para subir a la App Store:
      # se elige el Xcode más nuevo que tenga la máquina.
      - name: Elegir Xcode
        run: |
          echo "Versiones de Xcode instaladas:"; ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # El juego como archivos estáticos (dist/), copiados al proyecto de Xcode con sus plugins.
      - name: Construir el juego
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Clave de App Store Connect
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Sin firmar: firmar aquí exigiría un perfil de desarrollo y un iPhone registrado.
      # La firma de distribución se hace en el paso siguiente, al exportar.
      # Cada subida a Apple necesita un número de compilación distinto: el de la ejecución.
      - name: Compilar
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/App.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Firmar y subir a TestFlight
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ios/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Subido. En unos minutos aparecerá en App Store Connect → TestFlight (compilación ${{ github.run_number }})."

      - name: Borrar la clave
        if: always()
        run: rm -rf ~/private_keys
